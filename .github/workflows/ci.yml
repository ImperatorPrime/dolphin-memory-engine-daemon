name: CI Build

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libboost-dev libcap-dev rpm

      - name: Get version
        id: version
        run: |
          VERSION=$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//' || echo "0.0.0")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DPACKAGE_VERSION=${{ steps.version.outputs.version }}

      - name: Build
        run: cmake --build build --parallel

      - name: Package DEB and RPM
        working-directory: build
        run: |
          cpack -G DEB
          cpack -G RPM

      - name: Package TGZ
        run: |
          VERSION=${{ steps.version.outputs.version }}
          STAGING="dolphin-memory-engine-daemon-${VERSION}-linux"
          mkdir -p "$STAGING"
          cp build/dolphin_memory_engine_daemon "$STAGING/"
          cp dist/dolphin-memory-engine-daemon.service "$STAGING/"
          cp dist/install.sh "$STAGING/"
          chmod +x "$STAGING/install.sh"
          tar czf "build/${STAGING}.tar.gz" "$STAGING"

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            build/*.deb
            build/*.rpm
            build/*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: packages

      - name: Create release
        run: |
          gh release create "${{ github.ref_name }}" packages/* \
            --title "${{ github.ref_name }}" \
            --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
