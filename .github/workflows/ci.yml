name: CI Build

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libboost-dev libcap-dev

      - name: Get version
        id: version
        run: |
          VERSION=$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//' || echo "0.0.0")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DPACKAGE_VERSION=${{ steps.version.outputs.version }}

      - name: Build
        run: cmake --build build --parallel

      - name: Package DEB
        working-directory: build
        run: cpack -G DEB

      - name: Package TGZ
        run: |
          VERSION=${{ steps.version.outputs.version }}
          STAGING="dolphin-memory-engine-daemon-${VERSION}-linux"
          mkdir -p "$STAGING"
          cp build/dolphin_memory_engine_daemon "$STAGING/"
          cp dist/dolphin-memory-engine-daemon.service "$STAGING/"
          cp dist/install.sh "$STAGING/"
          chmod +x "$STAGING/install.sh"
          tar czf "build/${STAGING}.tar.gz" "$STAGING"

      - name: Upload packages
        uses: actions/upload-artifact@v6
        with:
          name: packages
          path: |
            build/*.deb
            build/*.tar.gz

  build-rpm:
    runs-on: ubuntu-latest
    container: rockylinux:9

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: dnf install -y cmake boost-devel libcap-devel gcc-c++ make rpm-build git

      - name: Get version
        id: version
        run: |
          VERSION=$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//' || echo "0.0.0")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DPACKAGE_VERSION=${{ steps.version.outputs.version }}

      - name: Build
        run: cmake --build build --parallel

      - name: Package RPM
        working-directory: build
        run: cpack -G RPM

      - name: Upload RPM
        uses: actions/upload-artifact@v6
        with:
          name: rpm-package
          path: build/*.rpm

  test-deb:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v7
        with:
          name: packages
          path: packages

      - name: Test DEB installation
        run: |
          cp packages/*.deb docker/test-deb/package.deb
          docker build docker/test-deb/

  test-rpm:
    needs: build-rpm
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v7
        with:
          name: rpm-package
          path: packages

      - name: Test RPM installation
        run: |
          cp packages/*.rpm docker/test-rpm/package.rpm
          docker build docker/test-rpm/

  release:
    needs: [build, build-rpm, test-deb, test-rpm]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v7
        with:
          name: packages
          path: packages

      - uses: actions/download-artifact@v7
        with:
          name: rpm-package
          path: packages

      - name: Create release
        run: |
          gh release create "${{ github.ref_name }}" packages/* \
            --title "${{ github.ref_name }}" \
            --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
